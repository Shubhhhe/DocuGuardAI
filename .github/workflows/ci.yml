
name: DocuGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Check sample documentation
        run: python check_docs.py

      - name: Check changed Python settings against documentation
        run: python git_diff_check.py --base origin/main
        if: github.event_name == 'pull_request'
       
      - name: Check all changed Python files
        run: python dynamic_git_check.py --base origin/main
        if: github.event_name == 'pull_request'